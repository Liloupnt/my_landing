<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Le Wagon</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
<style>
    .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    .card {
        width: auto;
    }
    .card:last-child {
        grid-column: 1 / -1;
    }
</style>
</head>

<body>
		<!-- Banner -->
		<div class="banner">
			<div class="container">
				<h1>Change your life, learn to code</h1>
				<h2>Le Wagon brings tech skills to creative people. </h2>
				<a href="#" class="btn-blue" onclick="showForm(event)">Apply now</a>
			</div>
		</div>

		<!-- Section campuses-->
		<div class="container">
    		<h2>Le Wagon's campuses</h2>

    	<div class="cards">

    		<!-- Shanghai -->
        	<div class="card">
             <img src="images/shanghai.jpg" alt=" Le Wagon Shanghai">
             <div>
            	<h3>Shanghai</h3>
           		<a href="https://www.lewagon.com/shanghai" class="btn-link">Apply to Shanghai</a>
           	</div>
        </div>

        	<!-- Paris -->
        	<div class="card">
             <img src="images/paris.jpg" alt="Le Wagon Paris">
             <div>
            	<h3>Paris</h3>
           		<a href="https://www.lewagon.com/paris" class="btn-link">Apply to Paris</a>
           	</div>
        </div>

			<!-- Rio -->
        	<div class="card">
             <img src="images/rio.jpg" alt="Le Wagon Rio">
             <div>
            	<h3>Rio</h3>
           		<a href="https://www.lewagon.com/rio" class="btn-link">Apply to Rio</a>
           	</div>
        </div>

    </div>
	</div>


 <div id="form-container" style="display: none;"></div>

  <div class="typeform-widget"
       data-url="https://boris165.typeform.com/to/BQ1ugB"
       style="width: 100%; height: 500px;">
  </div>

  <div style="font-family: Sans-Serif; font-size: 12px; color: #999; opacity: 0.5; padding-top: 5px;">
    powered by
    <a href="https://admin.typeform.com/signup?utm_campaign=BQ1ugB&utm_source=typeform.com-12651312-Basic&utm_medium=typeform&utm_content=typeform-embedded-poweredbytypeform&utm_term=EN"
       style="color: #999"
       target="_blank">
      Typeform
    </a>
  </div>

</div>

	<script>
function showForm(event) {
  event.preventDefault();

  const container = document.getElementById("form-container");

  // Si déjà chargé, on affiche juste
  if (container.innerHTML !== "") {
    container.style.display = "block";
    return;
  }

  // Injecter le Typeform dynamiquement
  container.innerHTML = `
    <div class="typeform-widget"
         data-url="https://boris165.typeform.com/to/BQ1ugB"
         style="width: 100%; height: 500px;">
    </div>
  `;

  container.style.display = "block";

  // Charger le script Typeform
  var d = document, js, id = "typef_orm";
  if (!document.getElementById(id)) {
    js = d.createElement("script");
    js.id = id;
    js.src = "https://embed.typeform.com/embed.js";
    document.body.appendChild(js);
  }
}
	</script>

</body>
</html>
